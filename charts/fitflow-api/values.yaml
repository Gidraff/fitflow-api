replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/gidraff-cloudkite-58sdk3/fitflow-repo/fitflow-api
  pullPolicy: Always
  tag: "2836f9a5fdb69f0a737ed522f13fe9cbf17e2efc"

service:
  type: ClusterIP
  port: 8081

database:
  name: "fitflow_db"
  secretName: "fitflow-secrets"
  # Replace with: project-id:region:instance-id
  connectionName: "gidraff-cloudkite-58sdk3:us-central1:cordiafit-db"

keycloak:
  # Internal K8s DNS for Keycloak v2
  issuerUrl: "http://keycloak-v2.keycloak.svc.cluster.local:8080/auth/realms/trainer-app"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (useful for Workload Identity)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "fitflow-api-sa"

  # Add this for the deployment.yaml probes/resources
autoscaling:
  enabled: false

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# These are often used in the ingress.yaml template
ingress:
  enabled: false