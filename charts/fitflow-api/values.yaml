replicaCount: 1

image:
  repository: ghcr.io/your-username/fitflow-api
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8081

database:
  name: "fitflow_db"
  secretName: "fitflow-secrets"
  # Replace with: project-id:region:instance-id
  connectionName: "gidraff-cloudkite-58sdk3:us-central1:cordiafit-db"

keycloak:
  # Internal K8s DNS for Keycloak v2
  issuerUrl: "http://keycloak-v2.keycloak.svc.cluster.local:8080/auth/realms/trainer-app"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi