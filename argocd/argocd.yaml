apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitflow-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gidraff/fitflow-api.git
    targetRevision: HEAD
    path: ../charts/fitflow-api # Path to the Helm chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fitflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true