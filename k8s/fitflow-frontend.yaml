apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitflow-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gidraff/fitflow-api.git # Same repo
    targetRevision: HEAD
    path: charts/fitflow-frontend # Path to frontend chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true