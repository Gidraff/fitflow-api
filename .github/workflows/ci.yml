name: Release to GAR

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

env:
  GAR_LOCATION: us-central1 
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REPOSITORY: fitflow-repo
  API_IMAGE: fitflow-api
  FE_IMAGE: fitflow-frontend

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for better git management

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # --- 1. Database Migrations (Backend prerequisite) ---
      - name: Run Migrations
        env:
          CONNECTION_NAME: ${{ secrets.CONNECTION_NAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy $CONNECTION_NAME --port 5432 & 
          sleep 5
          migrate -path ./migrations/ -database "postgres://$DB_USERNAME:$DB_PASS@127.0.0.1:5432/$DB_NAME?sslmode=disable" up

      # --- 2. Build & Push API (Backend) ---
      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile 
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}:latest

      # --- 3. Build & Push Frontend (Vite) ---
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/web
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FE_IMAGE }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FE_IMAGE }}:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_AUTH_URL=${{ vars.VITE_AUTH_URL }}
            VITE_REALM=${{ vars.VITE_REALM }}
            VITE_CLIENT_ID=${{ vars.VITE_CLIENT_ID }}

      # --- 4. Atomic Helm Update ---
      - name: Update Helm Charts & Git Push
        run: |
          # Update API values
          sed -i "s|repository: .*|repository: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.API_IMAGE }}|" charts/fitflow-api/values.yaml
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" charts/fitflow-api/values.yaml
          
          # Update Frontend values
          sed -i "s|repository: .*|repository: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FE_IMAGE }}|" charts/fitflow-frontend/values.yaml
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" charts/fitflow-frontend/values.yaml
          
          # Single commit for both changes
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add charts/
          git commit -m "chore: release version ${{ github.sha }} (API & Frontend)"
          git push