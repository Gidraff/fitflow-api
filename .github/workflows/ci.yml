name: Release to GAR

on:
  push:
    branches: [main]

permissions:
  contents: write   # To push the helm value changes back to the repo
  id-token: write    # To authenticate with Google via OIDC

env:
  GAR_LOCATION: us-central1 
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REPOSITORY: fitflow-repo
  IMAGE: fitflow-api

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Keyless Auth using Workload Identity
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # 2. Login to GAR
      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 3. Build and Push (Using Release Tag)
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
          build-args: |
            API_VERSION=${{ github.event.release.tag_name }}
            BUILD_ENV=production

      # 4. Update Helm for ArgoCD
      - name: Update Helm Chart
        run: |
          sed -i "s|repository: .*|repository: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}|" charts/fitflow-api/values.yaml
          sed -i "s/tag: .*/tag: \"${{ github.event.release.tag_name }}\"/" charts/fitflow-api/values.yaml
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add charts/fitflow-api/values.yaml
          git commit -m "chore: release version ${{ github.event.release.tag_name }}"
          git push